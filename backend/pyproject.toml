[project]
name = "soon-trade-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.44.3",
    "email-validator>=2.3.0",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.0",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
