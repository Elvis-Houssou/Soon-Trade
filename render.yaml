# Déploiement de l'API sur Render (Blueprint). Site : Vercel. Base PostgreSQL : Neon.
# Les valeurs secrètes ne sont jamais ici : « sync: false » les fait saisir dans Render.
# Version de Python : backend/.python-version (3.14, dernier correctif choisi par Render).
services:
  - type: web
    name: soontrade-api
    runtime: python
    rootDir: backend
    region: frankfurt
    # Plan gratuit : mise en veille après 15 min sans visite (réveil en 30 à 60 s), pas de Shell
    # ni de preDeployCommand. Passer à « 0.5c-512mb » quand l'usage le justifiera.
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Migrations au démarrage, avant d'accepter du trafic : une version ne sert jamais un schéma
    # périmé (le plan gratuit n'a pas d'étape « preDeploy »). Un seul processus : 0,1 processeur.
    # --proxy-headers : l'adresse réelle du client (journal d'audit), transmise par Vercel puis Render.
    startCommand: uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health/ready
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Adresse Neon DIRECTE (hôte sans « -pooler »), avec ?sslmode=require : migrations
      # comprises, et psycopg 3 prépare ses requêtes, mal supporté par le mode mutualisé.
      - key: DATABASE_URL
        sync: false
      # Adresse du site Vercel, ex. https://soon-trade.vercel.app (et la même entre ["…"] pour CORS).
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Sans domaine vérifié : « SupportSoonTrade <onboarding@resend.dev> » (envoi au seul titulaire du compte Resend).
      - key: EMAIL_FROM
        sync: false
      # Stockage des documents : AWS S3 (endpoint vide) ou Cloudflare R2 (endpoint https, région « auto »).
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
